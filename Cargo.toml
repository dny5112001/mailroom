[package]
name = "mailroom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, single-binary SMTP server and web inbox for testing email locally"
license = "MIT"
readme = "README.md"
keywords = ["smtp", "email", "testing", "mailpit", "mailhog"]
categories = ["email", "development-tools::testing", "command-line-utilities"]
exclude = ["/.github", "/scripts", "/docs"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
linkify = "0.11.0"
mail-parser = "0.11.9"
rcgen = "0.14.10"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
